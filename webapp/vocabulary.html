<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vocabulary</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" media="(prefers-color-scheme: dark)">
    <script type="module" src="assets/nav-bar.js"></script>
</head>
<body>
    <site-nav></site-nav>
    <main class="container">
        <p class="lead">The work-in-progress vocabulary used in the knowledge graph:
            <a href="https://codeberg.org/benjaminaaron/d-stack-kg/src/branch/main/definitions/vocabulary.ttl" target="_blank" rel="noopener">definitions/vocabulary.ttl</a></p>
        <pre class="language-turtle"><code id="vocab" class="language-turtle">Loading…</code></pre>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-turtle.min.js"></script>
    <script type="module">
        // vite ?raw inlines the committed vocabulary as a string, nothing to fetch
        import vocab from "../definitions/vocabulary.ttl?raw"
        const code = document.getElementById("vocab")
        code.textContent = vocab
        if (window.Prism) Prism.highlightElement(code)
    </script>
</body>
</html>
