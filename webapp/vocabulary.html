<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vocabulary</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" media="(prefers-color-scheme: dark)">
    <script type="module" src="assets/nav-bar.js"></script>
</head>
<body>
    <site-nav></site-nav>
    <main class="container">
        <h2>Vocabulary</h2>
        <p class="lead">The work-in-progress vocabulary used in the knowledge graph:
            <a href="https://codeberg.org/benjaminaaron/d-stack-kg/src/branch/main/authored/vocabulary.ttl" target="_blank" rel="noopener">authored/vocabulary.ttl</a></p>
        <pre class="language-turtle"><code id="vocab" class="language-turtle">Loading…</code></pre>

        <h2>Knowledge graph</h2>
        <p class="lead">A preview of the generated graph <code>data/2-enrich-kg/d-stack-kg.ttl</code> - first 100 lines:</p>
        <pre class="language-turtle"><code id="dstack" class="language-turtle">Loading…</code></pre>
        <p>... see the full graph <a href="https://codeberg.org/benjaminaaron/d-stack-kg/src/branch/main/data/2-enrich-kg/d-stack-kg.ttl" target="_blank" rel="noopener">here</a></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-turtle.min.js"></script>
    <script type="module">
        // vite ?raw inlines the committed vocabulary as a string, nothing to fetch
        import vocab from "../authored/vocabulary.ttl?raw"
        // the graph is ~7k lines, so import only its URL and preview the head
        import dstackUrl from "../data/2-enrich-kg/d-stack-kg.ttl?url"

        const render = (id, ttl) => {
            const code = document.getElementById(id)
            code.textContent = ttl
            if (window.Prism) Prism.highlightElement(code)
        }
        render("vocab", vocab)

        // Preview the first 100 lines
        fetch(dstackUrl, { headers: { Range: "bytes=0-16383" } })
            .then(r => r.text())
            .then(ttl => render("dstack", ttl.split("\n").slice(0, 100).join("\n")))
    </script>
</body>
</html>
