<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Query</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script type="module" src="assets/nav-bar.js"></script>
    <script type="module" src="assets/query.js"></script>
</head>
<body class="full">
    <site-nav></site-nav>
    <main class="query-main">
        <div class="query-toolbar">
            <label class="toolbar-label" for="examples">Examples</label>
            <select id="examples" aria-label="Example queries">
                <option value="" selected disabled>Select an example…</option>
            </select>
            <button id="toggle-visual" type="button" aria-expanded="false">Build your own query<span class="caret"></span></button>
        </div>
        <p id="builder-hint" hidden>Build a query by clicking through the graph — it fills the editor below and runs. Powered by Sparnatural.</p>
        <div id="sparnatural-wrap" hidden></div>
        <div id="yasgui"></div>
    </main>
</body>
</html>
